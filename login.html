<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --tx:#0f1b3d; --tx2:#5b6785; --tx3:#9aa5bd; --ln:#dfe6f3; --az:#1d4ed8; --az2:#4338ca; }
  html { background:#eef3fb; }
  body { font-family:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; justify-content:center; align-items:center;
         padding:28px 16px; background:#eef3fb; color:var(--tx); position:relative; overflow-x:hidden; }
  body::before { content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:radial-gradient(40% 35% at 15% 20%,rgba(37,99,235,.22),transparent 70%),radial-gradient(35% 30% at 85% 15%,rgba(226,174,74,.30),transparent 70%),radial-gradient(45% 40% at 70% 90%,rgba(99,102,241,.20),transparent 70%); filter:blur(10px); }
  button, input { font:inherit; }
  .box { position:relative; z-index:1; width:100%; max-width:430px; background:rgba(255,255,255,.74); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
         border:1px solid rgba(255,255,255,.9); border-radius:30px; padding:30px 22px 24px; box-shadow:0 30px 60px rgba(15,27,61,.14), inset 0 1px 0 #fff; animation:lg-entra .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes lg-entra { from { opacity:0; transform:translateY(14px) scale(.985); } to { opacity:1; transform:none; } }
  .lg-topo { display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px; }
  .lg-marca { width:128px; height:128px; object-fit:contain; border-radius:50%; margin-bottom:12px; filter:drop-shadow(0 12px 22px rgba(156,100,22,.45)); }
  .lg-nome { font-family:Sora, 'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:27px; letter-spacing:-.02em; color:var(--tx); line-height:1.15; }
  .lg-nome em { font-style:normal; background:linear-gradient(90deg,#E9B954,#B47A1F); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lg-nome .lg-amp { font-weight:700; color:#94a3b8; margin:0 1px; }
  .lg-tag { font-size:10.5px; font-weight:800; letter-spacing:.22em; color:#8a6a2a; margin-top:5px; }
  .lg-sub { margin-top:12px; display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--ln); padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--tx2); }
  .lg-sub::before { content:""; width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.2); flex:none; }
  .langs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 20px; }
  .langs button { border:1px solid var(--ln); background:rgba(255,255,255,.75); color:var(--tx2); padding:8px 13px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; }
  .langs button.on { background:linear-gradient(135deg,var(--az),var(--az2)); color:#fff; border-color:transparent; box-shadow:0 6px 14px rgba(37,99,235,.28); }
  .campo { display:flex; align-items:center; gap:12px; height:58px; padding:0 16px; border-radius:16px; border:1.5px solid var(--ln); background:rgba(255,255,255,.88); margin-bottom:12px; text-align:left; transition:border-color .15s, box-shadow .15s; }
  .campo:focus-within { border-color:var(--az); box-shadow:0 0 0 4px rgba(37,99,235,.16); background:#fff; }
  .campo .ic { width:22px; height:22px; color:var(--tx3); flex:none; display:flex; } .campo .ic svg { width:22px; height:22px; }
  .campo:focus-within .ic { color:var(--az); }
  .campo input { flex:1; min-width:0; border:0; outline:0; background:none; font-size:16px; color:var(--tx); font-weight:500; }
  .campo input::placeholder { color:var(--tx3); }
  .olho { width:36px; height:36px; margin-right:-8px; border:0; background:none; color:var(--tx3); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:10px; flex:none; }
  .olho svg { width:22px; height:22px; } .olho.on { color:var(--az); }
  .link-esqueci { display:block; margin:2px 0 16px; font-size:13.5px; font-weight:600; color:var(--az); text-align:right; cursor:pointer; }
  .link-esqueci:hover { text-decoration:underline; }
  .btn-principal { width:100%; height:58px; border:0; border-radius:16px; font-family:Sora, 'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:16px; letter-spacing:.14em; cursor:pointer; color:#fff;
                   background:linear-gradient(135deg,var(--az),var(--az2)); box-shadow:0 14px 28px rgba(37,99,235,.38); transition:transform .12s, box-shadow .15s, opacity .15s; }
  .btn-principal:active { transform:scale(.985); }
  .btn-principal:disabled { opacity:.6; cursor:not-allowed; box-shadow:none; }
  .erro-msg { color:#b91c1c; font-size:14px; margin-top:12px; display:none; text-align:left; background:#fef2f2; border:1px solid #fecaca; padding:11px 13px; border-radius:12px; font-weight:600; }
  .sucesso-msg { color:#15803d; font-size:14px; margin-top:12px; display:none; text-align:left; background:#f0fdf4; border:1px solid #bbf7d0; padding:11px 13px; border-radius:12px; font-weight:600; }
  .ou { display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--tx3); font-size:13px; } .ou::before, .ou::after { content:""; flex:1; height:1px; background:var(--ln); }
  .btn-google { width:100%; height:54px; border-radius:16px; border:1.5px solid var(--ln); background:rgba(255,255,255,.9); color:var(--tx); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; transition:border-color .15s; }
  .btn-google:hover { border-color:#c7d2fe; } .btn-google svg { width:20px; height:20px; }
  .rodape { text-align:center; margin:22px 0 14px; font-size:14.5px; color:var(--tx2); }
  .rodape a { color:var(--az); font-weight:800; text-decoration:none; }
  .lg-banca { display:flex; align-items:center; justify-content:center; gap:6px 8px; flex-wrap:wrap; padding:13px 14px; border-radius:14px; background:#ecfdf5; color:#047857; font-size:14px; font-weight:600; border:1px dashed #86efac; text-decoration:none; text-align:center; }
  .lg-banca b { font-weight:800; }
  #btn-entrar-offline { height:52px; border-radius:16px !important; }
  @media (min-width:768px) and (min-height:601px) { .box { max-width:460px; padding:38px 34px 28px; } .lg-marca { width:140px; height:140px; } }
  @media (orientation:landscape) and (max-height:600px) {
    body { padding:10px 16px; }
    .box { max-width:820px; display:grid; grid-template-columns:1fr 1.15fr; gap:0 28px; align-items:center; padding:12px 22px; }
    .lg-topo { grid-row:1 / span 12; margin:0; }
    .lg-marca { width:clamp(60px,22vh,110px); height:clamp(60px,22vh,110px); }
    .langs { margin-bottom:8px; } .langs button { padding:5px 11px; font-size:12px; }
    .campo { height:42px; margin-bottom:7px; } .btn-principal { height:44px; } .btn-google { height:40px; }
    .link-esqueci { margin:0 0 6px; font-size:12.5px; } .ou { margin:6px 0; } .rodape { margin:8px 0 6px; font-size:13px; } .lg-banca { padding:8px 12px; font-size:13px; }
  }
  /* Telemóvel: tudo cabe no ecrã, sem deslizar — os tamanhos acompanham a altura do ecrã */
  @media (max-width:767px) {
    body { padding:max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); min-height:100vh; min-height:100svh; }
    .box { padding:clamp(14px,2.6svh,28px) 18px clamp(12px,2.2svh,22px); border-radius:26px; }
    .lg-topo { margin-bottom:clamp(10px,2svh,20px); }
    .lg-marca { width:clamp(68px,14svh,124px); height:clamp(68px,14svh,124px); margin-bottom:clamp(4px,1.1svh,12px); }
    .lg-nome { font-size:clamp(21px,3.3svh,27px); }
    .lg-tag { font-size:clamp(9px,1.25svh,10.5px); margin-top:3px; }
    .lg-sub { margin-top:clamp(6px,1.2svh,12px); padding:5px 12px; font-size:12px; }
    .langs { margin-bottom:clamp(10px,2svh,20px); gap:6px; }
    .langs button { padding:clamp(5px,.9svh,8px) 12px; font-size:12.5px; }
    .campo { height:clamp(46px,6.6svh,58px); margin-bottom:clamp(8px,1.4svh,12px); }
    .link-esqueci { margin:0 0 clamp(10px,1.8svh,16px); }
    .btn-principal { height:clamp(48px,6.6svh,58px); }
    .ou { margin:clamp(9px,1.8svh,18px) 0; }
    .btn-google { height:clamp(44px,6svh,54px); }
    .rodape { margin:clamp(10px,2svh,22px) 0 clamp(8px,1.4svh,14px); font-size:14px; }
    .lg-banca { padding:clamp(8px,1.4svh,13px) 12px; font-size:13.5px; }
  }
  @media (max-width:767px) and (max-height:660px) { .lg-marca { width:60px; height:60px; } .campo { height:44px; } .btn-principal { height:46px; } .btn-google { height:42px; } .lg-sub { margin-top:4px; } }
  @media (max-width:767px) and (max-height:600px) { .lg-marca { width:50px; height:50px; } .langs { margin-bottom:8px; } .lg-topo { margin-bottom:8px; } .ou { margin:7px 0; } .rodape { margin:8px 0 6px; } }
</style>

<script src="supabase-config.js"></script>
<script src="spap-recuperar.js?v=1"></script>
<script>
  const btn = document.getElementById('btn-entrar');
  const erroDiv = document.getElementById('erro-msg');
  const sucessoDiv = document.getElementById('sucesso-msg');

  // Conta da Banca a tentar entrar na Loja: são contas separadas
  function mostrarContaBanca() {
    erroDiv.innerHTML = '🧺 Este email é de uma conta da <b>BANCA</b>, não da Loja.<br>A Loja e a Banca são separadas: para usar a Loja, crie uma conta da Loja em «Criar loja grátis». '
      + '<a href="login-banca.html" style="color:inherit;font-weight:800;text-decoration:underline;">Entrar na Banca →</a>';
    erroDiv.style.display = 'block';
    sucessoDiv.style.display = 'none';
  }
  try { if (new URLSearchParams(location.search).get('conta') === 'banca') setTimeout(function(){ mostrarContaBanca(); }, 60); } catch(e) {}
  function mostrarErro(msg) {
    erroDiv.textContent = '❌ ' + msg;
    erroDiv.style.display = 'block';
    sucessoDiv.style.display = 'none';
  }
  function mostrarSucesso(msg) {
    sucessoDiv.textContent = '✅ ' + msg;
    sucessoDiv.style.display = 'block';
    erroDiv.style.display = 'none';
  }

  function traduzirErro(msg) {
    if (!msg) return 'Erro desconhecido.';
    if (msg.includes('Invalid login') || msg.includes('invalid_credentials')) return 'Email ou senha incorretos.';
    if (msg.includes('Email not confirmed')) return 'Email ainda não confirmado. Verifica a tua caixa de entrada.';
    if (msg.includes('Too many requests') || msg.includes('rate limit')) return 'Demasiadas tentativas. Aguarda alguns minutos.';
    if (msg.includes('User not found')) return 'Nenhuma conta encontrada com este email.';
    return msg;
  }

  // Destino após login — lê do localStorage (gravado pelo monitor antes de redirecionar)
  function destinoAposLogin() {
    const destino = localStorage.getItem('pdv_login_destino') || 'index.html';
    localStorage.removeItem('pdv_login_destino');
    return destino;
  }

  // Mensagem quando o PDV redireciona por loja não activa
  (function() {
    const params = new URLSearchParams(window.location.search);
    const est = params.get('estado');
    if (!est) return;
    if (!spapEuSuper() && (est === 'suspenso' || est === 'bloqueado')) {
      mostrarErro('🚫 A tua loja foi suspensa. Contacta o suporte: +258 86 657 7722');
    } else {
      mostrarErro('⏳ A tua loja está a aguardar confirmação de pagamento. Envia o comprovativo via WhatsApp e aguarda a activação. Se não responderem em 5 minutos, liga para o suporte: +258 86 657 7722');
    }
  })();

  // Se já há sessão válida, salta direto (funciona OFFLINE — o Supabase guarda a sessão no aparelho)
  (async () => {
    try {
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session) {
        // A Loja e a Banca são separadas: uma conta da Banca não abre a Loja.
        try {
          const { data: mb, error: eMb } = await supabaseClient.from('membros_loja')
            .select('lojas(tipo_loja, estado)').eq('user_id', data.session.user.id).limit(20);
          if (!eMb && mb && mb.length && !spapMembrosDoTipo(mb, 'loja').length) {
            try { await supabaseClient.auth.signOut({ scope: 'local' }); } catch(e) {}
            mostrarContaBanca(); return;
          }
        } catch(e) {}
        window.location.href = destinoAposLogin(); return;
      }
    } catch(e) {}
    // Sem sessão do SDK mas offline com PDV já usado antes: mostra botão de entrada offline
    if (!navigator.onLine && localStorage.getItem('pdv_cache_sessao')) {
      mostrarBotaoOffline();
    }
  })();

  function mostrarBotaoOffline() {
    if (document.getElementById('btn-entrar-offline')) return;
    const b = document.createElement('button');
    b.id = 'btn-entrar-offline';
    b.innerHTML = '📵 Entrar sem internet (modo offline)';
    b.style.cssText = 'width:100%;margin-top:12px;padding:14px;background:#f97316;border:none;border-radius:12px;color:white;font-size:15px;font-weight:bold;cursor:pointer;';
    b.onclick = () => { window.location.href = 'index.html'; };
    const box = document.querySelector('.box') || document.body;
    box.appendChild(b);
  }
  // Se a ligação cair enquanto está no login, oferece a entrada offline
  window.addEventListener('offline', () => { if (localStorage.getItem('pdv_cache_sessao')) mostrarBotaoOffline(); });

  async function fazerLogin() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    if (!email || !senha) { mostrarErro('Preenche email e senha.'); return; }

    btn.disabled = true; btn.textContent = 'A entrar...';

    let data, error;
    try {
      const r = await supabaseClient.auth.signInWithPassword({ email, password: senha });
      data = r.data; error = r.error;
    } catch (netErr) { error = { message: 'Failed to fetch' }; }

    if (error) {
      // Se é falha de REDE e já usámos o PDV antes nesta conta, entra offline
      const m = (error.message || '').toLowerCase();
      const _offOk = (!navigator.onLine || m.includes('fetch') || m.includes('network')) ? await spapVerificarAcessoOffline(email, senha) : null;
      if (_offOk === false) { mostrarErro('Email ou senha errados.'); btn.disabled = false; btn.textContent = 'ENTRAR'; return; }
      if ((!navigator.onLine || m.includes('fetch') || m.includes('network')) && (localStorage.getItem('pdv_cache_sessao') || (_offOk && Object.keys(localStorage).some(k => k.startsWith('spap_cache_mon_'))))) {
        btn.textContent = 'A entrar offline...';
        window.location.href = /monitor/.test(localStorage.getItem('pdv_login_destino') || '') ? 'monitor.html' : 'index.html';
        return;
      }
      mostrarErro((!navigator.onLine || m.includes('fetch') || m.includes('network')) ? '📡 Sem internet. Para entrar sem internet, este aparelho tem de ter entrado uma vez com internet nesta conta.' : traduzirErro(error.message));
      btn.disabled = false; btn.textContent = 'ENTRAR';
      return;
    }
    try { await spapGuardarAcessoOffline(email, senha); } catch (e) {}

    // Verifica se a loja está activa (pagamento confirmado)
    btn.textContent = 'A verificar conta...';
    const { data: membros } = await supabaseClient
      .from('membros_loja')
      .select('loja_id, lojas(estado, nome, tipo_loja, data_expiracao)')
      .eq('user_id', data.user.id)
      .limit(20).then(r => { const todos = r.data || []; r.data = spapMembrosDoTipo(todos, 'loja'); r.soBanca = todos.length > 0 && !r.data.length; return r; })
      .then(r => { window._soBanca = r.soBanca; return r; });

    // A Loja e a Banca são separadas: este email só tem conta da Banca
    if (window._soBanca) {
      try { await supabaseClient.auth.signOut({ scope: 'local' }); } catch(e) {}
      mostrarContaBanca();
      btn.disabled = false; btn.textContent = 'ENTRAR';
      return;
    }

    if (membros && membros.length > 0) {
      const estadoLoja = membros[0].lojas && membros[0].lojas.estado;
      const nomeLoja = (membros[0].lojas && membros[0].lojas.nome) || 'a tua loja';
      const tipoLoja = (membros[0].lojas && membros[0].lojas.tipo_loja) || '';

      // Plano por pagar (expirado, suspenso ou à espera de pagamento): entra, mas fica no ecrã de pagar o plano
      if (!spapEhSuper(email)) {
        const _exp = membros[0].lojas && membros[0].lojas.data_expiracao ? new Date(membros[0].lojas.data_expiracao) : null;
        const _mot = (estadoLoja === 'suspenso' || estadoLoja === 'bloqueado') ? 'suspenso'
          : (_exp && _exp <= new Date()) ? 'expirou'
          : (estadoLoja === 'pendente' || estadoLoja === 'pendente_pagamento') ? 'pendente' : null;
        if (_mot) {
          const _de = /monitor/.test(localStorage.getItem('pdv_login_destino') || '') ? 'monitor' : 'loja';
          window.location.href = 'planos.html?m=' + _mot + (_exp ? '&exp=' + encodeURIComponent(_exp.toISOString()) : '') + '&de=' + _de;
          return;
        }
      }

    }

    window.location.href = destinoAposLogin();
  }

  async function entrarComGoogle() {
    try {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: new URL('login.html', location.href).href }
      });
      if (error) mostrarErro('O Google ainda não está ligado no Supabase (Authentication → Providers → Google). ' + error.message);
    } catch(e) { mostrarErro('Erro: ' + (e.message || e)); }
  }

  function esqueceuSenha() {
    spapRecuperarSenha({ tipo: 'loja', email: document.getElementById('email').value.trim(), aoEntrar: function (em, se) {
      document.getElementById('email').value = em; document.getElementById('senha').value = se;
      mostrarSucesso('✅ Senha alterada. A entrar…'); fazerLogin();
    } });
  }

  document.querySelectorAll('.campo input').forEach(i => {
    i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); fazerLogin(); } });
  });
  document.getElementById('email').focus();

  // ===== IDIOMAS no login =====
  const LG_TR = {
    pt: { sub:'Sistema de Ponto de Venda', email:'Email', senha:'Senha', esqueci:'Esqueci a senha', entrar:'ENTRAR' },
    en: { sub:'Point of Sale System', email:'Email', senha:'Password', esqueci:'Forgot password', entrar:'LOG IN' },
    fr: { sub:'Système de Point de Vente', email:'E-mail', senha:'Mot de passe', esqueci:'Mot de passe oublié', entrar:'SE CONNECTER' },
    zh: { sub:'销售点系统', email:'邮箱', senha:'密码', esqueci:'忘记密码', entrar:'登录' }
  };
  function lgAplicar(lang) {
    const t = LG_TR[lang] || LG_TR.pt;
    const set = (id, prop, val) => { const el = document.getElementById(id); if (el) el[prop] = val; };
    set('lg-sub','textContent',t.sub);
    set('email','placeholder',t.email);
    set('senha','placeholder',t.senha);
    set('lg-esqueci','textContent',t.esqueci);
    set('btn-entrar','textContent',t.entrar);
    ['pt','en','fr','zh'].forEach(l => {
      const b = document.getElementById('lgl-'+l);
      if (b) b.classList.toggle('on', String(lang||'pt').indexOf(l) === 0);
    });
  }
  function lgVerSenha() {
    const i = document.getElementById('senha'), o = document.getElementById('lg-olho');
    const ver = i.type === 'password'; i.type = ver ? 'text' : 'password'; o.classList.toggle('on', ver);
    o.setAttribute('aria-label', ver ? 'Esconder senha' : 'Mostrar senha'); i.focus();
  }
  function lgLingua(lang) { try { localStorage.setItem('pdv_lingua', lang); } catch(e){} lgAplicar(lang); }
  lgAplicar((function(){ try { return localStorage.getItem('pdv_lingua') || 'pt'; } catch(e){ return 'pt'; } })());
</script>
<script>
let eventoInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  eventoInstalar = e;
  if (!window.matchMedia('(display-mode: standalone)').matches) {
    const b = document.createElement('button');
    b.id = 'btn-instalar-app';
    b.innerHTML = '📲 Instalar App no tablet';
    b.style.cssText = 'position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9000;background:#16a34a;color:white;border:none;border-radius:24px;padding:13px 22px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.3);';
    b.onclick = async () => {
      if (!eventoInstalar) return;
      eventoInstalar.prompt();
      const r = await eventoInstalar.userChoice;
      if (r.outcome === 'accepted') b.remove();
      eventoInstalar = null;
    };
    document.body.appendChild(b);
  }
});
window.addEventListener('appinstalled', () => { const b = document.getElementById('btn-instalar-app'); if (b) b.remove(); });
</script>

<script>
function googleTranslateElementInit(){
  new google.translate.TranslateElement({pageLanguage:'pt', includedLanguages:'pt,en,fr,zh-CN', autoDisplay:false}, 'google_translate_element');
}
function traduzirPagina(lang){
  if(lang==='zh') lang='zh-CN';
  try{ localStorage.setItem('pdv_lingua', lang); }catch(e){}
  var val = (!lang || lang==='pt') ? '' : '/pt/'+lang;
  document.cookie = 'googtrans='+val+';path=/';
  try{ document.cookie = 'googtrans='+val+';path=/;domain=.'+location.hostname; }catch(e){}
  var combo = document.querySelector('.goog-te-combo');
  if(combo && val){ combo.value = lang; combo.dispatchEvent(new Event('change')); }
  else { location.reload(); }
}
// Os botoes de idioma que ja existem passam a usar o Google Tradutor
window.mudarLingua = function(l){ traduzirPagina(l); };
window.lgLingua = function(l){ traduzirPagina(l); };
window.mudarLinguaMonitor = function(l){ traduzirPagina(l); };
</script>
