<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sem ligação</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Roboto,sans-serif;background:#111111;color:#fff}
  .c{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
  .ico{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:18px;animation:p 2s ease-in-out infinite}
  @keyframes p{50%{transform:scale(1.07)}}
  h1{font-size:21px;margin:0 0 8px}
  p{margin:0 0 22px;opacity:.85;font-size:14.5px;line-height:1.45;max-width:320px}
  button{background:linear-gradient(135deg,#f5c542,#c8901a);color:#111;border:0;border-radius:14px;padding:14px 30px;font-size:16px;font-weight:700}
  small{display:block;margin-top:16px;opacity:.6;font-size:12px}
</style>
</head>
<body>
<div class="c">
  <div class="ico">📶</div>
  <h1>Sem ligação à internet</h1>
  <p>Liga os dados móveis ou o Wi-Fi e toca em «Tentar de novo».</p>
  <button onclick="SPAPNative.tentarDeNovo()">Tentar de novo</button>
  <small>A app tenta outra vez sozinha quando a internet voltar.</small>
</div>
<script>
  window.addEventListener('online', function(){ SPAPNative.tentarDeNovo(); });
</script>
</body>
</html>
