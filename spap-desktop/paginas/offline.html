<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>SPAP Sercriativo — sem ligação</title>
<style>
  html,body { margin:0; height:100%; }
  body { background:radial-gradient(900px 500px at 50% -10%, rgba(201,154,59,.25), transparent 60%), #121218; color:#f8f5ee;
         font:15px/1.5 "Segoe UI", system-ui, Roboto, Arial, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; overflow:hidden; box-sizing:border-box; }
  .c { max-width:520px; }
  img { width:84px; height:84px; border-radius:22px; box-shadow:0 12px 30px rgba(0,0,0,.45); }
  h1 { font-size:26px; margin:18px 0 8px; }
  p { color:#b9b2a3; margin:0 0 22px; }
  button { font:inherit; font-weight:800; border:0; border-radius:14px; padding:14px 26px; cursor:pointer; color:#15151d; background:linear-gradient(90deg,#f3d27a,#c99a3b); box-shadow:0 10px 24px rgba(201,154,59,.3); }
  .sec { background:none; color:#f3d27a; box-shadow:none; border:1px solid rgba(243,210,122,.35); margin-left:8px; }
  small { display:block; margin-top:22px; color:#8f897c; }
</style>
</head>
<body>
<div class="c">
  <img src="app.png" alt="">
  <h1>Sem ligação à internet</h1>
  <p>É a primeira vez que este computador abre esta app, por isso ainda não há cópia guardada para usar sem internet.<br>Ligue a internet e clique em «Tentar de novo». Depois da primeira entrada, a app passa a funcionar mesmo sem internet.</p>
  <button onclick="SPAPDesktop.tentarDeNovo()">Tentar de novo</button>
  <button class="sec" onclick="SPAPDesktop.trocarApp()">Escolher outra app</button>
  <small>Suporte: +258 86 166 7843</small>
</div>
<script>window.addEventListener('online', function () { SPAPDesktop.tentarDeNovo(); });</script>
</body>
</html>
