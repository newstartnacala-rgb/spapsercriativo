<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spap-Sercriativo — Nova Senha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .box { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); text-align: center; }
  .logo { font-size: 26px; font-weight: bold; color: #1a56a0; margin-bottom: 6px; }
  .logo span { color: #e05c00; }
  .subtitulo { font-size: 13px; color: #999; margin-bottom: 28px; }
  .campo { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 14px; padding: 12px 14px; gap: 10px; }
  .campo:focus-within { border-color: #1a56a0; }
  .campo span { font-size: 17px; }
  .campo input { border: none; outline: none; width: 100%; font-size: 14px; color: #333; }
  .forca-senha { height: 4px; border-radius: 2px; margin-top: -10px; margin-bottom: 14px; background: #eee; overflow: hidden; }
  .forca-senha-barra { height: 100%; width: 0; transition: width 0.3s, background 0.3s; border-radius: 2px; }
  .btn { width: 100%; padding: 14px; background: #1a56a0; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn:hover { background: #154a8a; }
  .btn:disabled { background: #a0b4cc; cursor: not-allowed; }
  .msg-erro { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; padding: 10px; background: #fdecea; border-radius: 8px; }
  .msg-sucesso { color: #27ae60; font-size: 13px; margin-top: 12px; display: none; padding: 10px; background: #eafaf1; border-radius: 8px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icone-topo { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="box">
  <img src="logo.png" alt="Spap-Sercriativo" style="width:200px;max-width:100%;margin-bottom:4px;">
  <div class="subtitulo">Sistema de Ponto de Venda</div>

  <div id="estado-verificando">
    <div class="icone-topo">⏳</div>
    <p style="color:#666;font-size:14px;">A verificar o teu link de recuperação...</p>
  </div>

  <div id="estado-form" style="display:none;">
    <div class="icone-topo">🔑</div>
    <h2 style="margin-bottom:8px;font-size:18px;color:#333;">Nova Senha</h2>
    <p style="color:#666;font-size:13px;margin-bottom:20px;">Escolhe uma senha segura para a tua conta.</p>

    <div class="campo">
      <span>🔒</span>
      <input type="password" id="nova-senha" placeholder="Nova senha (mín. 6 caracteres)" oninput="verificarForca(this.value)" />
    </div>
    <div class="forca-senha"><div class="forca-senha-barra" id="barra-forca"></div></div>

    <div class="campo">
      <span>🔒</span>
      <input type="password" id="confirmar-senha" placeholder="Confirmar nova senha" />
    </div>

    <button class="btn" id="btn-guardar" onclick="guardarNovaSenha()">GUARDAR NOVA SENHA</button>
    <div class="msg-erro" id="msg-erro"></div>
    <div class="msg-sucesso" id="msg-sucesso"></div>
  </div>

  <div id="estado-invalido" style="display:none;">
    <div class="icone-topo">⚠️</div>
    <h2 style="margin-bottom:8px;font-size:16px;color:#e05c00;">Link inválido ou expirado</h2>
    <p style="color:#666;font-size:13px;margin-bottom:20px;">
      Este link de recuperação já expirou ou é inválido.<br>Pede um novo link na página de login.
    </p>
    <button class="btn" onclick="window.location.href='login.html'">IR PARA O LOGIN</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kggqshpqydhvtxklixyk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FLR81R0et5RIFR9WToVjsQ_RoP3RPew';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function verificarForca(senha) {
  const barra = document.getElementById('barra-forca');
  let f = 0;
  if (senha.length >= 6) f++;
  if (senha.length >= 10) f++;
  if (/[A-Z]/.test(senha)) f++;
  if (/[0-9]/.test(senha)) f++;
  if (/[^A-Za-z0-9]/.test(senha)) f++;
  const cores = ['#e74c3c','#e05c00','#f39c12','#27ae60','#1a56a0'];
  const larg  = ['20%','40%','60%','80%','100%'];
  barra.style.width      = f > 0 ? larg[f-1] : '0';
  barra.style.background = f > 0 ? cores[f-1] : '#eee';
}

// Verificar sessão de recuperação ao carregar
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    document.getElementById('estado-verificando').style.display = 'none';
    document.getElementById('estado-form').style.display = 'block';
  } else if (event === 'SIGNED_IN' && session) {
    // Já está logado normalmente — redirecionar
    window.location.href = 'index.html';
  }
});

// Se não houver evento em 3s, o link é inválido
setTimeout(() => {
  if (document.getElementById('estado-verificando').style.display !== 'none') {
    document.getElementById('estado-verificando').style.display = 'none';
    document.getElementById('estado-invalido').style.display = 'block';
  }
}, 3000);

async function guardarNovaSenha() {
  const nova    = document.getElementById('nova-senha').value;
  const confirmar = document.getElementById('confirmar-senha').value;
  const msgErro = document.getElementById('msg-erro');
  const msgOk   = document.getElementById('msg-sucesso');

  msgErro.style.display = 'none';
  msgOk.style.display = 'none';

  if (nova.length < 6) {
    msgErro.textContent = '❌ A senha deve ter pelo menos 6 caracteres.';
    msgErro.style.display = 'block';
    return;
  }
  if (nova !== confirmar) {
    msgErro.textContent = '❌ As senhas não coincidem.';
    msgErro.style.display = 'block';
    return;
  }

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> A guardar...';

  const { error } = await sb.auth.updateUser({ password: nova });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'GUARDAR NOVA SENHA';
    msgErro.textContent = '❌ Erro: ' + error.message;
    msgErro.style.display = 'block';
    return;
  }

  msgOk.textContent = '✅ Senha alterada com sucesso! A redirecionar para o login...';
  msgOk.style.display = 'block';
  btn.style.display = 'none';

  setTimeout(() => {
    sb.auth.signOut();
    window.location.href = 'login.html';
  }, 2500);
}
</script>
</body>
</html>
