name: Sondar tabelas
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://kggqshpqydhvtxklixyk.supabase.co
          K=sb_publishable_FLR81R0et5RIFR9WToVjsQ_RoP3RPew
          for t in descontos balancos entregas perdas venda_itens vendas caixa_sobras; do echo "$t $(curl -s -H "apikey: $K" "$U/rest/v1/$t?select=*&limit=0" -o /tmp/o -w '%{http_code}') $(head -c 200 /tmp/o)"; done
          for c in "venda_itens?select=preco_original" "venda_itens?select=desconto" "vendas?select=desconto" "vendas?select=vendedor_codigo" "descontos?select=venda_id" "balancos?select=detalhe" "entregas?select=descontos"; do echo "$c $(curl -s -H "apikey: $K" "$U/rest/v1/$c&limit=0" -o /tmp/o -w '%{http_code}') $(head -c 160 /tmp/o)"; done
