name: T-Connect APK (debug)
on:
  push:
    paths: [ 'tconnect/**', '.github/workflows/tconnect-apk.yml' ]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tconnect-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar componentes do SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APKs debug
        working-directory: tconnect/android-native
        run: |
          chmod +x gradlew
          VN=$(grep -oE "TC_APP_VERSION='[0-9.]+'" app/src/main/assets/tc236/guardian/js/app.js | head -1 | grep -oE "[0-9.]+")
          [ -z "$VN" ] && VN="2.39.0"
          VC=$(( 2400 + ${GITHUB_RUN_NUMBER:-1} ))
          echo "A compilar versao $VN (code $VC)"
          # Mantem o manifesto de atualizacoes sincronizado com a versao do build (nunca fica preso numa versao antiga)
          MAN="app/src/main/assets/tc236/updates/t-connect-update.json"
          [ -f "$MAN" ] && sed -i -E 's/"version"[[:space:]]*:[[:space:]]*"[0-9.]+"/"version": "'"$VN"'"/' "$MAN" && echo "manifesto -> $VN"
          ./gradlew assembleChildDebug assembleGuardianDebug --no-daemon --stacktrace -PappVersionName="$VN" -PappVersionCode="$VC"
      - name: Gravar APKs no repositório
        run: |
          mkdir -p apks-build
          cp tconnect/android-native/app/build/outputs/apk/child/debug/app-child-debug.apk apks-build/TConnect-MinhaEmergencia.apk
          cp tconnect/android-native/app/build/outputs/apk/guardian/debug/app-guardian-debug.apk apks-build/TConnect-Guardian.apk
          ls -lh apks-build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apks-build/*.apk
          git commit -m "APKs compilados [skip ci]" || echo "sem mudanças"
          git pull --rebase --autostash || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: tconnect-apks
          path: apks-build/*.apk
          retention-days: 7
      - name: Montar site (GitHub Pages)
        run: |
          TC=tconnect/android-native/app/src/main/assets/tc236
          rm -rf _site && mkdir -p _site/downloads
          # App web completa (Guardian/Child, assets, updates, sw)
          cp -r "$TC"/. _site/
          # Página de downloads como raiz do site (substitui o seletor simples)
          cp tconnect/site/index.html _site/index.html
          # APKs e guia para descarregar do próprio site
          cp apks-build/TConnect-Guardian.apk _site/downloads/
          cp apks-build/TConnect-MinhaEmergencia.apk _site/downloads/
          cp tconnect/site/downloads/T-Connect-Guia-Instalacao.pdf _site/downloads/ 2>/dev/null || true
          # Evita o Jekyll (serve ficheiros tal como estão)
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
