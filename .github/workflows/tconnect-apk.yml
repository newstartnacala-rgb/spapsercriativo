name: T-Connect APK (debug)
on:
  push:
    paths: [ 'tconnect/**', '.github/workflows/tconnect-apk.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar componentes do SDK (usa o SDK pré-instalado do runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APKs debug
        working-directory: tconnect/android-native
        run: |
          chmod +x gradlew
          ./gradlew assembleChildDebug assembleGuardianDebug --no-daemon --stacktrace
      - name: Reunir APKs
        run: |
          mkdir -p out
          cp tconnect/android-native/app/build/outputs/apk/child/debug/app-child-debug.apk out/TConnect-MinhaEmergencia.apk
          cp tconnect/android-native/app/build/outputs/apk/guardian/debug/app-guardian-debug.apk out/TConnect-Guardian.apk
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: tconnect-apks
          path: out/*.apk
          retention-days: 7
