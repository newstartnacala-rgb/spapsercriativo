name: Verificar site publicado
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/verificar-site.yml', 'vendassteam/**', 'banca-version.json', 'SPAPSERCRIATIVOPOSS/banca-version.json', 'version.json', 'SPAPSERCRIATIVOPOSS/version.json', 'SPAPSERCRIATIVOPOSS/apps/app-version.json' ]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar o Vercel publicar
        run: sleep 90
      - name: Ler versões publicadas
        run: |
          mkdir -p out
          for d in spapsercriativo.vercel.app spapsercriativo-spapcercruativoteam.vercel.app spapsercriativo2950.vercel.app spapsercriativo2950-spapcercruativoteam.vercel.app spapsercriativo-git-main-spapcercruativoteam.vercel.app spapsercriativo2950-git-main-spapcercruativoteam.vercel.app newstartnacala-rgb.github.io/spapsercriativo; do
            V=$(curl -s -m 20 -o /tmp/v.json -w '%{http_code}' "https://$d/version.json?t=$(date +%s)")
            VS=$(grep -oE '"versao" *: *"[^"]*"' /tmp/v.json 2>/dev/null | head -1)
            M=$(curl -s -m 20 "https://$d/monitor.html?t=$(date +%s)" | grep -oE "MONITOR_VERSAO = '[^']*'|agua-mar|topbar-titulo" | sort -u | tr '\n' ' ')
            I=$(curl -s -m 20 "https://$d/index.html?t=$(date +%s)" | grep -oE "VERSAO_ATUAL = '[^']*'|pdv_modo_moderno_lancado" | sort -u | tr '\n' ' ')
            A=$(curl -s -m 20 "https://$d/apps/app-version.json?t=$(date +%s)" | grep -oE '"versao" *: *"[^"]*"' | head -1)
            K=$(curl -s -m 30 -o /dev/null -w '%{http_code} %{size_download} %{content_type}' "https://$d/apps/SPAP-Monitor.apk")
            P=$(curl -s -m 20 -o /dev/null -w '%{http_code} %{content_type}' "https://$d/apps/SPAP-Loja.mobileconfig")
            B=$(curl -s -m 30 -o /dev/null -w '%{http_code} %{size_download}' "https://$d/apps/SPAP-Banca.apk")
            BT=$(curl -s -m 20 "https://$d/mobile.html?t=$(date +%s)" | grep -oE 'banca-tema' | head -1)
            BV=$(curl -s -m 20 "https://$d/banca-version.json?t=$(date +%s)" | grep -oE '"versao" *: *"[^"]*"' | head -1)
            BA=$(curl -s -m 20 "https://$d/apps/app-banca-version.json?t=$(date +%s)" | grep -oE '"versao" *: *"[^"]*"' | head -1)
            echo "$d | http=$V | $VS | monitor: $M | loja: $I | app: $A apk=$K | iphone=$P | banca: apk=$B tema=$BT site=$BV app=$BA" | tee -a out/resultado.txt
          done
          VS=$(curl -s -m 20 -o /tmp/vs.html -w '%{http_code}' "https://newstartnacala-rgb.github.io/spapsercriativo/vendassteam/?t=$(date +%s)")
          VT=$(grep -oE '<title>[^<]*' /tmp/vs.html | head -1)
          VA=$(curl -sL -m 60 -o /dev/null -w '%{http_code} %{size_download}' "https://github.com/newstartnacala-rgb/spapsercriativo/releases/download/banca-latest/SPAP-Banca.apk")
          echo "vendassteam | http=$VS | $VT | apk banca github=$VA" | tee -a out/resultado.txt
      - name: Gravar resultado
        run: |
          git init -q r && cd r
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          cp ../out/resultado.txt .
          date -u >> resultado.txt
          git add . && git commit -qm "verificacao [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:verificacao
# re-verificar após publicar as apps
