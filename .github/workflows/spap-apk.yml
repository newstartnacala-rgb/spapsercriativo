name: SPAP Apps Android (Monitor + Loja + Banca + Banca Monitor)
on:
  push:
    branches: [ main ]
    paths: [ 'spap-android/**', '.github/workflows/spap-apk.yml', 'SPAPSERCRIATIVOPOSS/version.json', 'SPAPSERCRIATIVOPOSS/banca-version.json' ]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: spap-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar componentes do SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APKs
        working-directory: spap-android
        run: |
          chmod +x gradlew
          code() { python3 -c "v='$1'.split('.')+['0','0'];print(int(v[0])*1000000+int(v[1])*10000+int(v[2]))"; }
          # Loja + Monitor seguem a versão principal (version.json)
          VN=$(python3 -c "import json;print(json.load(open('../SPAPSERCRIATIVOPOSS/version.json'))['versao'])")
          # Banca + Banca Monitor têm versões próprias (banca-version.json)
          VB=$(python3 -c "import json;print(json.load(open('../SPAPSERCRIATIVOPOSS/banca-version.json'))['versao'])")
          echo "Principal: $VN  |  Banca: $VB"
          echo "VN=$VN" >> $GITHUB_ENV; echo "VB=$VB" >> $GITHUB_ENV
          ./gradlew assembleMonitorRelease assembleLojaRelease --no-daemon --stacktrace -PappVersionName="$VN" -PappVersionCode="$(code $VN)"
          ./gradlew assembleBancaRelease assembleBancamonitorRelease --no-daemon --stacktrace -PappVersionName="$VB" -PappVersionCode="$(code $VB)"
      - name: Publicar em Releases (links fixos de download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apks-build SPAPSERCRIATIVOPOSS/apps
          cp spap-android/app/build/outputs/apk/monitor/release/app-monitor-release.apk apks-build/SPAP-Monitor.apk
          cp spap-android/app/build/outputs/apk/loja/release/app-loja-release.apk apks-build/SPAP-Loja.apk
          cp spap-android/app/build/outputs/apk/banca/release/app-banca-release.apk apks-build/SPAP-Banca.apk
          cp spap-android/app/build/outputs/apk/bancamonitor/release/app-bancamonitor-release.apk apks-build/SPAP-Banca-Monitor.apk
          # Canal principal: loja-latest (Loja + Monitor). Canal da Banca: banca-latest (Banca + Banca Monitor).
          publicar() {
            TAG="$1"; TIT="$2"; NOTA="$3"; shift 3
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" "$@" --title "$TIT" --notes "$NOTA" --latest=false
          }
          publicar loja-latest "Loja e Monitor $VN" "versao=$VN" apks-build/SPAP-Loja.apk apks-build/SPAP-Monitor.apk
          publicar banca-latest "Banca e Monitor Banca $VB" "versao=$VB" apks-build/SPAP-Banca.apk apks-build/SPAP-Banca-Monitor.apk
      - name: Publicar APKs no site (para cada app se atualizar sozinha)
        run: |
          # APKs no site do GitHub Pages (a raiz do repositório): …github.io/spapsercriativo/apps/SPAP-*.apk
          mkdir -p apps && cp apks-build/SPAP-*.apk apps/
          # (banca/bancamonitor aqui só para as apps da Banca antigas, ≤2.9.202, passarem para a linha 3.x)
          REL="https://github.com/${{ github.repository }}/releases/download"
          # links absolutos para os lançamentos do GitHub: funcionam no GitHub Pages e na Vercel
          printf '{"versao":"%s","data":"%s","monitor":"%s/loja-latest/SPAP-Monitor.apk","loja":"%s/loja-latest/SPAP-Loja.apk","banca":"%s/banca-latest/SPAP-Banca.apk","bancamonitor":"%s/banca-latest/SPAP-Banca-Monitor.apk"}\n' "$VN" "$(date -u +%Y-%m-%d)" "$REL" "$REL" "$REL" "$REL" > SPAPSERCRIATIVOPOSS/apps/app-version.json
          printf '{"versao":"%s","data":"%s","banca":"%s/banca-latest/SPAP-Banca.apk","bancamonitor":"%s/banca-latest/SPAP-Banca-Monitor.apk"}\n' "$VB" "$(date -u +%Y-%m-%d)" "$REL" "$REL" > SPAPSERCRIATIVOPOSS/apps/app-banca-version.json
          # o GitHub Pages publica a raiz do repositório: copiar também os ficheiros de versão
          mkdir -p apps && cp SPAPSERCRIATIVOPOSS/apps/app-version.json SPAPSERCRIATIVOPOSS/apps/app-banca-version.json apps/
          cat SPAPSERCRIATIVOPOSS/apps/app-version.json SPAPSERCRIATIVOPOSS/apps/app-banca-version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f SPAPSERCRIATIVOPOSS/apps apps
          git commit -m "Apps SPAP $VN e Banca $VB publicadas no site" || echo "sem mudanças"
          git pull --rebase --autostash || true
          git push
      - name: Voltar a verificar o site (com a app nova)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run verificar-site.yml --ref main || true
      - uses: actions/upload-artifact@v4
        with:
          name: spap-apks
          path: apks-build/SPAP-*.apk
          retention-days: 14
