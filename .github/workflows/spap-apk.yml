name: SPAP Apps Android (Monitor + Loja + Banca + Banca Monitor)
on:
  push:
    branches: [ main ]
    paths: [ 'spap-android/**', '.github/workflows/spap-apk.yml', 'SPAPSERCRIATIVOPOSS/version.json' ]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: spap-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar componentes do SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APKs
        working-directory: spap-android
        run: |
          chmod +x gradlew
          # A app tem a MESMA versão do sistema (version.json) → sobe em cada atualização
          VN=$(python3 -c "import json;print(json.load(open('../SPAPSERCRIATIVOPOSS/version.json'))['versao'])")
          VC=$(python3 -c "v='$VN'.split('.')+['0','0'];print(int(v[0])*1000000+int(v[1])*10000+int(v[2]))")
          echo "Versão da app: $VN (code $VC)"
          echo "VN=$VN" >> $GITHUB_ENV
          ./gradlew assembleMonitorRelease assembleLojaRelease assembleBancaRelease assembleBancamonitorRelease --no-daemon --stacktrace -PappVersionName="$VN" -PappVersionCode="$VC"
      - name: Publicar APKs no site (para a app se atualizar sozinha)
        run: |
          mkdir -p apks-build SPAPSERCRIATIVOPOSS/apps
          cp spap-android/app/build/outputs/apk/monitor/release/app-monitor-release.apk apks-build/SPAP-Monitor.apk
          cp spap-android/app/build/outputs/apk/loja/release/app-loja-release.apk apks-build/SPAP-Loja.apk
          cp spap-android/app/build/outputs/apk/banca/release/app-banca-release.apk apks-build/SPAP-Banca.apk
          cp spap-android/app/build/outputs/apk/bancamonitor/release/app-bancamonitor-release.apk apks-build/SPAP-Banca-Monitor.apk
          cp apks-build/SPAP-Monitor.apk apks-build/SPAP-Loja.apk apks-build/SPAP-Banca.apk apks-build/SPAP-Banca-Monitor.apk SPAPSERCRIATIVOPOSS/apps/
          printf '{"versao":"%s","data":"%s","monitor":"apps/SPAP-Monitor.apk","loja":"apps/SPAP-Loja.apk","banca":"apps/SPAP-Banca.apk","bancamonitor":"apps/SPAP-Banca-Monitor.apk"}\n' "$VN" "$(date -u +%Y-%m-%d)" > SPAPSERCRIATIVOPOSS/apps/app-version.json
          cat SPAPSERCRIATIVOPOSS/apps/app-version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f SPAPSERCRIATIVOPOSS/apps
          git commit -m "Apps SPAP $VN publicadas no site" || echo "sem mudanças"
          git pull --rebase --autostash || true
          git push
      - name: Publicar em Releases (link fixo de download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apps-v$VN"
          gh release create "$TAG" apks-build/SPAP-Monitor.apk apks-build/SPAP-Loja.apk apks-build/SPAP-Banca.apk apks-build/SPAP-Banca-Monitor.apk \
            --title "SPAP Apps $VN" \
            --notes "SPAP Monitor, SPAP Loja, SPAP Banca e SPAP Banca Monitor (Android). Instalar: descarregar o APK e abrir no telemóvel." \
            --latest || gh release upload "$TAG" apks-build/SPAP-Monitor.apk apks-build/SPAP-Loja.apk apks-build/SPAP-Banca.apk apks-build/SPAP-Banca-Monitor.apk --clobber
      - name: Voltar a verificar o site (com a app nova)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run verificar-site.yml --ref main || true
      - uses: actions/upload-artifact@v4
        with:
          name: spap-apks
          path: apks-build/SPAP-*.apk
          retention-days: 14
