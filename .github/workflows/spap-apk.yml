name: SPAP Apps Android (Monitor + Loja + Banca + Banca Monitor)
on:
  push:
    branches: [ main ]
    paths: [ 'spap-android/**', '.github/workflows/spap-apk.yml', 'SPAPSERCRIATIVOPOSS/version.json', 'SPAPSERCRIATIVOPOSS/banca-version.json' ]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: spap-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar componentes do SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Guardar a ferramenta de compilação (Gradle) entre execuções
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/gradle-dist
          key: gradle-dist-8.9
      - name: Obter o Gradle (com servidores alternativos se o principal falhar)
        run: |
          mkdir -p ~/gradle-dist; Z=~/gradle-dist/gradle-8.9-bin.zip
          if [ ! -s "$Z" ] || ! unzip -tq "$Z" >/dev/null 2>&1; then
            for U in https://services.gradle.org/distributions/gradle-8.9-bin.zip \
                     https://github.com/gradle/gradle-distributions/releases/download/v8.9.0/gradle-8.9-bin.zip \
                     https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip \
                     https://mirrors.aliyun.com/gradle/distributions/v8.9.0/gradle-8.9-bin.zip \
                     https://downloads.gradle.org/distributions/gradle-8.9-bin.zip; do
              echo "A tentar $U"; curl -fsSL --retry 3 --retry-delay 5 --max-time 300 -o "$Z" "$U" && unzip -tq "$Z" >/dev/null 2>&1 && break
              rm -f "$Z"
            done
          fi
          [ -s "$Z" ] || { echo "Não foi possível obter o Gradle"; exit 1; }
          # o wrapper usa a cópia local (não depende da rede)
          sed -i "s|^distributionUrl=.*|distributionUrl=file\\:$Z|" spap-android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/^distributionSha256Sum/d' spap-android/gradle/wrapper/gradle-wrapper.properties
          cat spap-android/gradle/wrapper/gradle-wrapper.properties
      - name: Compilar APKs
        working-directory: spap-android
        run: |
          chmod +x gradlew
          code() { python3 -c "v='$1'.split('.')+['0','0'];print(int(v[0])*1000000+int(v[1])*10000+int(v[2]))"; }
          # Loja + Monitor seguem a versão principal (version.json)
          VN=$(python3 -c "import json;print(json.load(open('../SPAPSERCRIATIVOPOSS/version.json'))['versao'])")
          # Banca + Banca Monitor têm versões próprias (banca-version.json)
          VB=$(python3 -c "import json;print(json.load(open('../SPAPSERCRIATIVOPOSS/banca-version.json'))['versao'])")
          echo "Principal: $VN  |  Banca: $VB"
          echo "VN=$VN" >> $GITHUB_ENV; echo "VB=$VB" >> $GITHUB_ENV
          # Se o download das ferramentas falhar (rede do GitHub), tenta outra vez até 4 vezes
          tentar() { for i in 1 2 3 4; do "$@" && return 0; echo "Falhou (tentativa $i); a tentar de novo em 20 s…"; sleep 20; done; return 1; }
          tentar ./gradlew assembleMonitorRelease assembleLojaRelease --no-daemon --stacktrace -PappVersionName="$VN" -PappVersionCode="$(code $VN)"
          tentar ./gradlew assembleBancaRelease assembleBancamonitorRelease --no-daemon --stacktrace -PappVersionName="$VB" -PappVersionCode="$(code $VB)"
      - name: Publicar em Releases (links fixos de download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apks-build SPAPSERCRIATIVOPOSS/apps
          # Nomes dos ficheiros: Loja, Monitor, Banca-e-Vendas e Monitor-e-Banca
          cp spap-android/app/build/outputs/apk/monitor/release/app-monitor-release.apk apks-build/Monitor.apk
          cp spap-android/app/build/outputs/apk/loja/release/app-loja-release.apk apks-build/Loja.apk
          cp spap-android/app/build/outputs/apk/banca/release/app-banca-release.apk apks-build/Banca-e-Vendas.apk
          cp spap-android/app/build/outputs/apk/bancamonitor/release/app-bancamonitor-release.apk apks-build/Monitor-e-Banca.apk
          # cópias com os nomes antigos, só para as apps já instaladas encontrarem a atualização
          cp apks-build/Monitor.apk apks-build/SPAP-Monitor.apk; cp apks-build/Loja.apk apks-build/SPAP-Loja.apk
          cp apks-build/Banca-e-Vendas.apk apks-build/SPAP-Banca.apk; cp apks-build/Monitor-e-Banca.apk apks-build/SPAP-Banca-Monitor.apk
          # Canal principal: loja-latest (Loja + Monitor). Canal da Banca: banca-latest (Banca + Banca Monitor).
          publicar() {
            TAG="$1"; TIT="$2"; NOTA="$3"; shift 3
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" "$@" --title "$TIT" --notes "$NOTA" --latest=false
          }
          publicar loja-latest "Loja e Monitor $VN" "versao=$VN" apks-build/Loja.apk apks-build/Monitor.apk apks-build/SPAP-Loja.apk apks-build/SPAP-Monitor.apk
          publicar banca-latest "Banca e Vendas e Monitor e Banca $VB" "versao=$VB" apks-build/Banca-e-Vendas.apk apks-build/Monitor-e-Banca.apk apks-build/SPAP-Banca.apk apks-build/SPAP-Banca-Monitor.apk
      - name: Publicar APKs no site (para cada app se atualizar sozinha)
        run: |
          # APKs no site do GitHub Pages (a raiz do repositório): …github.io/spapsercriativo/apps/SPAP-*.apk
          mkdir -p apps && cp apks-build/*.apk apps/
          # (banca/bancamonitor aqui só para as apps da Banca antigas, ≤2.9.202, passarem para a linha 3.x)
          REL="https://github.com/${{ github.repository }}/releases/download"
          # links absolutos para os lançamentos do GitHub: funcionam no GitHub Pages e na Vercel
          printf '{"versao":"%s","data":"%s","monitor":"%s/loja-latest/Monitor.apk","loja":"%s/loja-latest/Loja.apk","banca":"%s/banca-latest/Banca-e-Vendas.apk","bancamonitor":"%s/banca-latest/Monitor-e-Banca.apk"}\n' "$VN" "$(date -u +%Y-%m-%d)" "$REL" "$REL" "$REL" "$REL" > SPAPSERCRIATIVOPOSS/apps/app-version.json
          printf '{"versao":"%s","data":"%s","banca":"%s/banca-latest/Banca-e-Vendas.apk","bancamonitor":"%s/banca-latest/Monitor-e-Banca.apk"}\n' "$VB" "$(date -u +%Y-%m-%d)" "$REL" "$REL" > SPAPSERCRIATIVOPOSS/apps/app-banca-version.json
          # o GitHub Pages publica a raiz do repositório: copiar também os ficheiros de versão
          mkdir -p apps && cp SPAPSERCRIATIVOPOSS/apps/app-version.json SPAPSERCRIATIVOPOSS/apps/app-banca-version.json apps/
          cat SPAPSERCRIATIVOPOSS/apps/app-version.json SPAPSERCRIATIVOPOSS/apps/app-banca-version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f SPAPSERCRIATIVOPOSS/apps apps
          git commit -m "Apps SPAP $VN e Banca $VB publicadas no site" || echo "sem mudanças"
          git pull --rebase --autostash || true
          git push
      - name: Voltar a verificar o site (com a app nova)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run verificar-site.yml --ref main || true
      - uses: actions/upload-artifact@v4
        with:
          name: spap-apks
          path: apks-build/SPAP-*.apk
          retention-days: 14
