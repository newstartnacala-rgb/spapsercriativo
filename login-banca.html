<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body.pm{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px;}
  .lb{width:100%;max-width:430px;padding:30px 22px 24px;}
  .lb .pm-topo{margin-bottom:22px;}
  .lb .pm-marca{width:124px;height:124px;}
  .lb-campo{display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;border-radius:16px;border:1.5px solid var(--pm-ln);background:rgba(255,255,255,.9);margin-bottom:12px;transition:border-color .15s,box-shadow .15s;}
  .lb-campo:focus-within{border-color:#f2700f;box-shadow:0 0 0 4px rgba(242,112,15,.15);background:#fff;}
  .lb-ic{width:22px;height:22px;color:var(--pm-tx3);flex:none;display:flex;} .lb-ic svg{width:22px;height:22px;}
  .lb-campo:focus-within .lb-ic{color:#f2700f;}
  .lb-campo input{flex:1;min-width:0;border:0 !important;outline:0;background:none !important;box-shadow:none !important;font-size:16px;color:var(--pm-tx);font-weight:500;padding:0 !important;}
  .lb-campo input::placeholder{color:var(--pm-tx3);}
  .lb-esqueci{display:block;margin:-4px 2px 12px auto;border:0;background:none;color:#1d4ed8;font-weight:700;font-size:13.5px;line-height:1.2;font-family:inherit;cursor:pointer;padding:4px 0;}
  .lb-olho{width:36px;height:36px;margin-right:-8px;border:0;background:none;color:var(--pm-tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .lb-olho svg{width:22px;height:22px;} .lb-olho.on{color:#f2700f;}
  .lb-entrar{width:100%;height:58px;margin-top:6px;border:0;border-radius:16px;font-family:Sora,'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;letter-spacing:.14em;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#ffa24a,#f2700f 55%,#e05c00);box-shadow:0 14px 28px rgba(242,112,15,.36);transition:transform .12s,opacity .15s;}
  .lb-entrar:active{transform:scale(.985);} .lb-entrar:disabled{opacity:.6;box-shadow:none;}
  .lb-erro{display:none;margin-top:12px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:600;}
  .lb-rodape{text-align:center;margin:22px 0 14px;font-size:14.5px;color:var(--pm-tx2);}
  .lb-rodape a{color:#ea580c;font-weight:800;text-decoration:none;}
  .lb-loja{display:flex;align-items:center;justify-content:center;gap:6px 8px;flex-wrap:wrap;padding:13px 14px;border-radius:14px;background:#eff6ff;color:#1d4ed8;font-size:14px;font-weight:600;border:1px dashed #93c5fd;text-decoration:none;}
  .lb-loja b{font-weight:800;}
  /* Telemóvel (de pé): tudo cabe no ecrã e acompanha a altura — com alternativa para Android antigo (vh) */
  @media (max-width:767px), (max-height:600px){
    body.pm{padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));}
    .lb{border-radius:26px !important;padding:20px 18px 18px;padding:clamp(18px,3.4vh,34px) 18px clamp(16px,2.8vh,28px);padding:clamp(18px,3.4svh,34px) 18px clamp(16px,2.8svh,28px);}
    .lb .pm-topo{margin-bottom:clamp(14px,3vh,28px);margin-bottom:clamp(14px,3svh,28px);}
    .lb .pm-marca{width:clamp(76px,17vh,150px);height:clamp(76px,17vh,150px);width:clamp(76px,17svh,150px);height:clamp(76px,17svh,150px);margin-bottom:clamp(6px,1.4svh,14px);}
    .pm-nome .pm-amp{font-weight:700;color:#94a3b8;margin:0 1px;}
    .lb .pm-nome{font-size:clamp(22px,3.5vh,28px);font-size:clamp(22px,3.5svh,28px);}
    .lb .pm-tag{font-size:clamp(9px,1.3vh,11px);}
    .lb .pm-extra{font-size:clamp(14px,2vh,16px);margin-top:clamp(5px,1.1vh,10px);}
    .lb .pm-sub{margin-top:clamp(7px,1.4vh,12px);}
    .lb-campo{height:clamp(50px,7.2vh,62px);height:clamp(50px,7.2svh,62px);margin-bottom:clamp(10px,1.7svh,14px);}
    .lb-entrar{height:clamp(50px,7.2vh,62px);height:clamp(50px,7.2svh,62px);margin-top:clamp(4px,1svh,10px);}
    .lb-rodape{margin:clamp(14px,2.8vh,26px) 0 clamp(10px,1.8vh,16px);}
    .lb-loja{padding:clamp(10px,1.7vh,14px) 12px;}
  }
  /* Telemóvel deitado: logótipo à esquerda, formulário à direita */
  @media (orientation:landscape) and (max-height:600px){
    .lb{max-width:760px;display:grid;grid-template-columns:1fr 1.1fr;gap:4px 26px;align-items:center;padding:18px 24px !important;}
    .lb .pm-topo{grid-row:1 / span 6;margin:0 !important;}
    .lb .pm-marca{width:clamp(64px,24vh,120px) !important;height:clamp(64px,24vh,120px) !important;}
    .lb-campo{height:46px !important;margin-bottom:8px !important;} .lb-entrar{height:46px !important;margin-top:2px !important;}
    .lb-rodape{margin:10px 0 8px !important;font-size:13.5px;} .lb-loja{padding:8px 12px !important;font-size:13px;}
  }
  /* O login fica sempre claro (o modo escuro é só dentro da app) */
  html.escuro{filter:none !important;}
  .lb-loja svg{width:20px;height:20px;flex:none;}
</style>
<link rel="apple-touch-icon" href="ios-banca-180.png">
<meta name="apple-mobile-web-app-title" content="Banca e Vendas">
<script src="app-android.js?v=3.7.42" defer></script>
<link rel="stylesheet" href="spap-carrinho.css?v=1">
</head>
<body class="pm">
<main class="lb pm-vidro pm-entra">
  <div class="pm-topo">
    <div class="pm-marca pc-cena laranja" role="img" aria-label="Carrinho de compras a andar — Spap-Sercriativo"><div class="pc-vento"><i></i><i></i><i></i></div><div class="pc-po"></div><div class="pc-po p2"></div><div class="pc-wrap"><img class="pc-caixa c1" src="icons3d/package.png" alt=""><img class="pc-caixa c2" src="icons3d/package-azul.png" alt=""><img class="pc-caixa c3" src="icons3d/coin.png" alt=""><img class="pc-c" src="icons3d/cart.png" alt=""></div><div class="pc-chao"></div><div class="pc-chao2"></div></div>
    <div class="pm-nome notranslate">Bancas <span class="pm-amp">&amp;</span> <em>Vendas</em></div>
    <div class="pm-tag notranslate">TECNOLOGIA VAREJISTA DE PONTA</div>
    <div class="pm-extra">A tua banca no bolso</div>
    <div class="pm-sub">Sistema de Ponto de Venda</div>
  </div>
  <label class="lb-campo"><span class="lb-ic"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg></span><input id="email" type="email" inputmode="email" placeholder="Email" autocomplete="username"></label>
  <label class="lb-campo"><span class="lb-ic"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg></span><input id="senha" type="password" placeholder="Código (senha)" autocomplete="current-password"><button type="button" class="lb-olho" id="lb-olho" aria-label="Mostrar código" onclick="verCodigo()"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></label>
  <button type="button" class="lb-esqueci" onclick="esqueceuSenha()">Esqueci a senha</button>
  <button class="lb-entrar" id="btn" onclick="entrar()">ENTRAR</button>
  <div class="lb-erro" id="erro"></div>
  <div class="lb-rodape">Ainda não tens banca? <a href="registo-banca.html">Cadastrar</a></div>
  <a class="lb-loja" href="login.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg>Tenho uma loja grande <b>→</b></a>
</main>
<script src="supabase-config.js"></script>
<script src="banca-offline.js"></script>
<script src="spap-recuperar.js?v=1"></script>
<script>
document.documentElement.classList.remove('escuro');
document.addEventListener('DOMContentLoaded',()=>{ document.documentElement.classList.remove('escuro'); const tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content','#eef3fb'); });
const btn=document.getElementById('btn');
function erro(m){ const e=document.getElementById('erro'); e.textContent=m; e.style.display='block'; }
try{ if(new URLSearchParams(location.search).get('conta')==='loja') setTimeout(()=>erro('🏪 Essa conta é de uma LOJA. A Loja e a Banca são separadas: entre com a conta da Banca ou crie uma em «Cadastrar».'),50); }catch(e){}

function esqueceuSenha(){ spapRecuperarSenha({ tipo:'banca', email:document.getElementById('email').value.trim(), aoEntrar:function(em,se){ document.getElementById('email').value=em; document.getElementById('senha').value=se; entrar(); } }); }
function destino(){ return new URLSearchParams(location.search).get('to') || 'mobile.html'; }
(async()=>{ try{ const {data}=await supabaseClient.auth.getSession(); if(data&&data.session){
  const r=await supabaseClient.from('membros_loja').select('lojas(tipo_loja,estado)').eq('user_id',data.session.user.id).limit(20);
  if(r.error){ location.href=destino(); return; }
  if(spapEuSuper() || spapMembrosDoTipo(r.data,'banca').length){ spapSessaoBancaOk(); location.href=destino(); } else { await spapSessaoBancaErrada(); }
} }catch(e){} })();

async function entrar(){
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  if(!email||!senha){ erro('Preenche o email e o código.'); return; }
  btn.disabled=true; btn.textContent='A entrar…';
  let data,error;
  try{ const r=await supabaseClient.auth.signInWithPassword({email,password:senha}); data=r.data; error=r.error; }
  catch(e){ error={message:'Failed to fetch'}; }
  if(error && spapEhErroDeRede(error.message)){
    // SEM INTERNET: entra no modo offline se este telemóvel já entrou antes com este email e esta senha
    const ok = await spapVerificarAcessoOffline(email, senha);
    const temDados = (window.bancaSessaoGuardada && bancaSessaoGuardada()) || localStorage.getItem('spap_ult_uid_bm');
    if(ok && temDados){ btn.textContent='A entrar offline…'; try{ sessionStorage.setItem('spap_modo_offline','1'); }catch(e){} location.href=destino(); return; }
    erro(ok===false ? 'Email ou código errado.' : '📡 Sem internet. Para entrar sem internet, este telemóvel tem de ter entrado uma vez com internet nesta conta.');
    btn.disabled=false; btn.textContent='ENTRAR'; return;
  }
  if(error){ erro(error.message.includes('Invalid')?'Email ou código errado.':error.message); btn.disabled=false; btn.textContent='ENTRAR'; return; }
  try{ await spapGuardarAcessoOffline(email, senha); localStorage.setItem('spap_ult_uid_bm', data.user.id); }catch(e){}
  // Verifica estado da banca
  try{
    const { data:mTodos }=await supabaseClient.from('membros_loja').select('lojas(estado,nome,tipo_loja,data_expiracao)').eq('user_id',data.user.id).limit(20);
    const m = spapMembrosDoTipo(mTodos||[],'banca');
    if(mTodos && mTodos.length && !m.length){
      await spapSessaoBancaErrada();
      erro('🏪 Este email é de uma conta da LOJA, não da Banca. A Loja e a Banca são separadas: para usar a Banca, crie uma conta da Banca em «Cadastrar».');
      btn.disabled=false; btn.textContent='ENTRAR'; return;
    }
    spapSessaoBancaOk();
    const est = m&&m[0]&&m[0].lojas&&m[0].lojas.estado;
    // plano por pagar (suspensa, expirada ou à espera): entra, mas fica no ecrã de pagar o plano
    if(!spapEuSuper()){
      const _l = (m&&m[0]&&m[0].lojas) || {}, _exp = _l.data_expiracao ? new Date(_l.data_expiracao) : null;
      const _mot = (est==='suspenso'||est==='bloqueado') ? 'suspenso' : (_exp && _exp <= new Date()) ? 'expirou' : (!_exp && (est==='pendente'||est==='pendente_pagamento')) ? 'pendente' : null;
      if(_mot){ location.href='planos-banca.html?m='+_mot; return; }
    }
  }catch(e){}
  location.href=destino();
}
function verCodigo(){ const i=document.getElementById('senha'),o=document.getElementById('lb-olho'); const v=i.type==='password'; i.type=v?'text':'password'; o.classList.toggle('on',v); i.focus(); }
document.getElementById('senha').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });
</script>
</body>
</html>
